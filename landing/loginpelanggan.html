<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Login Pelanggan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #081225, #2563eb);
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: #081225;
            padding: 20px 6%;
        }

        .navbar-content {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 8px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
        }

        .menu a:hover {
            background: #2563eb;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 55px;
        }

        .header h1 {
            color: #081225;
            margin: 10px 0;
        }

        .header p {
            color: #64748b;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #dc2626;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #15803d;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width:750px) {

            .navbar-content {
                flex-direction: column;
                gap: 15px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

        }
    </style>

</head>

<body>


    <nav class="navbar">

        <div class="navbar-content">

            <a href="produk.html" class="logo">
                🛠 RazForge
            </a>

            <ul class="menu">

                <li>
                    <a href="produk.html">🏠 Beranda</a>
                </li>

                <li>
                    <a href="produk.html">📖 Produk</a>
                </li>

                <li>
                    <a href="kategori.html">📁 Kategori</a>
                </li>

                <li>
                    <a href="kontak.html">☎️ Kontak</a>
                </li>

                <li>
                    <a href="registerpelanggan.html">📝 Daftar</a>
                </li>

            </ul>

        </div>

    </nav>


    <div class="container">

        <div class="card">

            <div class="header">

                <div class="icon">👤</div>

                <h1>Login Pelanggan</h1>

                <p>Masuk untuk membeli buku</p>

            </div>


            <div id="message" class="message"></div>


            <form id="loginForm">


                <div class="form-group">

                    <label>Username</label>

                    <input type="text" id="username" placeholder="Masukkan username" required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input type="password" id="password" placeholder="Masukkan password" required>

                </div>


                <button type="submit">
                    🔐 Login
                </button>


            </form>


            <div class="register">

                Belum punya akun?

                <a href="registerpelanggan.html">
                    Daftar sekarang
                </a>

            </div>

        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function (e) {

                e.preventDefault();


                const username =
                    document.getElementById("username")
                        .value.trim();


                const password =
                    document.getElementById("password")
                        .value;


                const message =
                    document.getElementById("message");


                let pelanggan = [];


                try {

                    pelanggan =
                        JSON.parse(
                            localStorage.getItem("daftarPelanggan")
                        ) || [];

                } catch (error) {

                    pelanggan = [];

                }


                if (pelanggan.length === 0) {

                    message.className = "message error";

                    message.innerText =
                        "❌ Belum ada akun. Silakan daftar terlebih dahulu.";

                    return;

                }


                const user =
                    pelanggan.find(function (data) {

                        return String(data.username)
                            .toLowerCase()
                            ===
                            username.toLowerCase()
                            &&
                            String(data.password)
                            ===
                            password;

                    });


                if (!user) {

                    message.className = "message error";

                    message.innerText =
                        "❌ Username atau password salah.";

                    return;

                }


                /* =================================
                   SIMPAN LOGIN
                ================================= */

                localStorage.setItem(
                    "pelangganLogin",
                    "true"
                );

                localStorage.setItem(
                    "pelangganAktif",
                    JSON.stringify(user)
                );

                localStorage.setItem(
                    "pelanggan",
                    JSON.stringify(user)
                );

                localStorage.setItem(
                    "usernamePelanggan",
                    user.username
                );

                localStorage.setItem(
                    "idPelanggan",
                    String(user.id)
                );


                /* =================================
                   LOGIN BERHASIL
                ================================= */

                message.className = "message success";

                message.innerText =
                    "✅ Login berhasil! Membuka dashboard...";


                /*
                   PENTING!
                
                   File ini berada di:
                
                   landing/loginpelanggan.html
                
                   Dashboard berada di:
                
                   pelanggan/dashboardpelanggan.html
                
                   Jadi:
                   ../ = keluar dari landing
                   pelanggan/ = masuk folder pelanggan
                */

                setTimeout(function () {

                    window.location.href =
                        "../pelanggan/dashboardpelanggan.html";

                }, 800);

            });

    </script>

</body>

</html>
