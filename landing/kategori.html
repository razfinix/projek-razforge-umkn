    <script>


        /* =====================================================
           DATA KATEGORI
        ===================================================== */

        let daftarKategori = [];


        /* =====================================================
           ICON KATEGORI
        ===================================================== */

        const iconKategori = {

            "Pemrograman": "💻",

            "Bisnis": "💼",

            "Novel": "📖",

            "Pendidikan": "🎓",

            "Teknologi": "🤖",

            "Agama": "📚",

            "Anak": "🧒",

            "UMKM": "🏪",

            "Komik": "🎨",

            "Motivasi": "⭐",

            "default": "📚"

        };


        /* =====================================================
           LOAD KATEGORI
        ===================================================== */

        function loadKategori() {

            let produk = [];


            if (
                typeof ambilProduk === "function"
            ) {

                produk = ambilProduk();

            }


            const namaKategori = [];


            produk.forEach(
                function (item) {

                    if (
                        item.kategori
                        &&
                        !namaKategori.includes(
                            item.kategori
                        )
                    ) {

                        namaKategori.push(
                            item.kategori
                        );

                    }

                }
            );


            /*
               Kalau database belum memiliki
               kategori, tampilkan kategori
               bawaan.
            */

            if (
                namaKategori.length === 0
            ) {

                namaKategori.push(
                    "Pemrograman",
                    "Bisnis",
                    "Pendidikan",
                    "Novel",
                    "Teknologi",
                    "UMKM"
                );

            }


            daftarKategori =
                namaKategori.map(
                    function (nama) {

                        const jumlah =
                            produk.filter(
                                function (item) {

                                    return (
                                        item.kategori
                                        === nama
                                    );

                                }
                            ).length;


                        return {

                            nama: nama,

                            jumlah: jumlah

                        };

                    }
                );


            tampilkanKategori();

        }


        /* =====================================================
           TAMPILKAN KATEGORI
        ===================================================== */

        function tampilkanKategori() {

            const container =
                document.getElementById(
                    "kategoriContainer"
                );


            const keyword =
                document.getElementById(
                    "searchKategori"
                )
                    .value
                    .toLowerCase();


            const hasil =
                daftarKategori.filter(
                    function (item) {

                        return item.nama
                            .toLowerCase()
                            .includes(
                                keyword
                            );

                    }
                );


            container.innerHTML = "";


            if (
                hasil.length === 0
            ) {

                container.innerHTML = `

            <div class="col-12">

                <div class="kosong">

                    <h2>
                        😥 Kategori Tidak Ditemukan
                    </h2>

                    <p>
                        Coba cari kategori
                        lainnya.
                    </p>

                </div>

            </div>

        `;

                return;

            }


            hasil.forEach(
                function (item) {

                    const icon =
                        iconKategori[
                        item.nama
                        ]
                        ||
                        iconKategori.default;


                    container.innerHTML += `

                <div
                    class="col-lg-4
                           col-md-6
                           mb-4">


                    <div
                        class="kategori-card">


                        <div
                            class="kategori-icon">

                            ${icon}

                        </div>


                        <div
                            class="kategori-body">


                            <h3>

                                ${item.nama}

                            </h3>


                            <p>

                                Temukan berbagai
                                koleksi buku
                                kategori
                                ${item.nama}.

                            </p>


                            <div
                                class="jumlah-buku">

                                📚
                                ${item.jumlah}
                                Buku

                            </div>


                            <button
                                class="btn-lihat"
                                onclick="
                                    bukaKategori(
                                        '${item.nama}'
                                    )
                                ">

                                📖 Lihat Produk

                            </button>


                        </div>

                    </div>

                </div>

            `;

                }
            );

        }


        /* =====================================================
           BUKA PRODUK SESUAI KATEGORI
        ===================================================== */

        function bukaKategori(
            kategori
        ) {

            localStorage.setItem(
                "filterKategori",
                kategori
            );


            window.location.href =
                "produk.html";

        }


        /* =====================================================
           JALANKAN
        ===================================================== */

        loadKategori();


    </script>
