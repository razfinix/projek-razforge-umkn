<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Laporan Penjualan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 225px;
            height: 100vh;
            background: #0f172a;
            color: white;
            padding: 25px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 10px;
            margin: 5px 0;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
        }

        .main {
            margin-left: 225px;
            padding: 35px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
            margin-bottom: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
        }

        .cetak {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .box {
            background: #eff6ff;
            padding: 22px;
            border-radius: 15px;
        }

        .box:nth-child(2) {
            background: #ecfdf5;
        }

        .box:nth-child(3) {
            background: #fff7ed;
        }

        .box:nth-child(4) {
            background: #fdf2f8;
        }

        .box h3 {
            font-size: 14px;
            color: #64748b;
        }

        .box p {
            font-size: 25px;
            font-weight: bold;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border: 1px solid #ddd;
        }

        @media(max-width:900px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width:600px) {

            .sidebar {
                width: 180px;
            }

            .main {
                margin-left: 180px;
                padding: 20px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

        }

        @media print {

            .sidebar {
                display: none;
            }

            .main {
                margin: 0;
            }

            .cetak {
                display: none;
            }

        }
    </style>

</head>

<body>


    <div class="sidebar">

        <div class="logo">
            📚 Admin
        </div>

        <a href="dashboarduser.html">
            🏠 Dashboard
        </a>

        <a href="kelolaproduk.html">
            📖 Kelola Produk
        </a>

        <a href="kelolakatagori.html">
            📁 Kelola Kategori
        </a>

        <a href="kelolapelanggan.html">
            👥 Kelola Pelanggan
        </a>

        <a href="kelolapenjualan.html">
            💰 Kelola Penjualan
        </a>

        <a href="keloladiskon.html">
            🏷️ Kelola Diskon
        </a>

        <a href="kelolauser.html">
            🔐 Kelola User
        </a>

        <a href="laporan.html" class="active">
            📊 Laporan
        </a>

        <a href="loginuser.html">
            🚪 Logout
        </a>

    </div>


    <div class="main">


        <div class="card">

            <div class="header">

                <h1>
                    📊 Laporan Penjualan
                </h1>

                <button class="cetak" onclick="window.print()">

                    🖨️ Cetak Laporan

                </button>

            </div>


            <div class="summary">


                <div class="box">

                    <h3>
                        Total Transaksi
                    </h3>

                    <p id="transaksi">
                        0
                    </p>

                </div>


                <div class="box">

                    <h3>
                        Total Pendapatan
                    </h3>

                    <p id="pendapatan">
                        Rp0
                    </p>

                </div>


                <div class="box">

                    <h3>
                        Produk Terjual
                    </h3>

                    <p id="produk">
                        0
                    </p>

                </div>


                <div class="box">

                    <h3>
                        Pelanggan
                    </h3>

                    <p id="pelanggan">
                        0
                    </p>

                </div>


            </div>

        </div>


        <div class="card">

            <h2 style="margin-bottom:20px;">
                📋 Detail Penjualan
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>No</th>

                        <th>Pelanggan</th>

                        <th>Produk</th>

                        <th>Harga</th>

                        <th>Tanggal</th>

                    </tr>

                </thead>

                <tbody id="tabel"></tbody>

            </table>

        </div>


    </div>


    <script>

        const penjualan =
            JSON.parse(
                localStorage.getItem("riwayatPembelian")
            ) || [];


        const pelanggan =
            JSON.parse(
                localStorage.getItem("daftarPelanggan")
            ) || [];


        function rupiah(angka) {

            return new Intl.NumberFormat(
                "id-ID",
                {
                    style: "currency",
                    currency: "IDR",
                    maximumFractionDigits: 0
                }
            ).format(angka);

        }


        let total = 0;


        const tabel =
            document.getElementById("tabel");


        tabel.innerHTML = "";


        penjualan.forEach(function (item, index) {

            const harga =
                Number(item.harga) || 0;

            total += harga;


            tabel.innerHTML += `

<tr>

<td>${index + 1}</td>

<td>
${item.namaPelanggan || item.username || "-"}
</td>

<td>
${item.namaProduk || item.produk || "-"}
</td>

<td>
${rupiah(harga)}
</td>

<td>
${item.tanggal || "-"}
</td>

</tr>

`;

        });


        document.getElementById(
            "transaksi"
        ).innerText = penjualan.length;


        document.getElementById(
            "pendapatan"
        ).innerText = rupiah(total);


        document.getElementById(
            "produk"
        ).innerText = penjualan.length;


        document.getElementById(
            "pelanggan"
        ).innerText = pelanggan.length;

    </script>

</body>

</html>
