<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 400px;
            border: none;
            border-radius: 20px;
        }
    </style>

</head>

<body>

    <div class="card shadow">

        <div class="card-body p-4">

            <h2 class="text-center mb-4">
                👨‍💼 Login Admin
            </h2>

            <input type="text" id="username" class="form-control mb-3" placeholder="Username">

            <input type="password" id="password" class="form-control mb-3" placeholder="Password">

            <button class="btn btn-primary w-100" onclick="loginAdmin()">

                Login

            </button>

            <br><br>

            <a href="../index.html" class="btn btn-secondary w-100">

                Kembali

            </a>

        </div>

    </div>

    <script>

        function loginAdmin() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;

            if (username == "razaq" && password == "123") {

                localStorage.setItem("adminLogin", "true");

                window.location.href = "dashboarduser.html";

            } else {

                alert("Username atau Password Salah!");

            }

        }

    </script>

</body>

</html>
