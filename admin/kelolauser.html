<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Kelola User</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 225px;
            height: 100vh;
            background: #0f172a;
            color: white;
            padding: 25px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 13px 10px;
            margin: 5px 0;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
        }

        .main {
            margin-left: 225px;
            padding: 35px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
        }

        .tambah {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border: 1px solid #ddd;
        }

        .edit {
            background: #ffc107;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .hapus {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .simpan {
            background: #198754;
            color: white;
            border: none;
            padding: 11px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .batal {
            background: #64748b;
            color: white;
            border: none;
            padding: 11px 15px;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>

</head>

<body>


    <div class="sidebar">

        <div class="logo">
            📚 Admin
        </div>

        <a href="dashboarduser.html">
            🏠 Dashboard
        </a>

        <a href="kelolaproduk.html">
            📖 Kelola Produk
        </a>

        <a href="kelolakatagori.html">
            📁 Kelola Kategori
        </a>

        <a href="kelolapelanggan.html">
            👥 Kelola Pelanggan
        </a>

        <a href="kelolapenjualan.html">
            💰 Kelola Penjualan
        </a>

        <a href="keloladiskon.html">
            🏷️ Kelola Diskon
        </a>

        <a href="kelolauser.html" class="active">
            🔐 Kelola User
        </a>

        <a href="laporan.html">
            📊 Laporan
        </a>

        <a href="loginuser.html">
            🚪 Logout
        </a>

    </div>


    <div class="main">

        <div class="card">

            <div class="header">

                <h1>
                    🔐 Kelola User
                </h1>

                <button class="tambah" onclick="bukaModal()">

                    ➕ Tambah User

                </button>

            </div>


            <table>

                <thead>

                    <tr>

                        <th>No</th>

                        <th>Nama</th>

                        <th>Username</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Aksi</th>

                    </tr>

                </thead>

                <tbody id="tabel"></tbody>

            </table>

        </div>

    </div>


    <div class="modal" id="modal">

        <div class="modal-box">

            <h2 id="judul">
                Tambah User
            </h2>


            <div class="form-group">

                <label>Nama</label>

                <input type="text" id="nama">

            </div>


            <div class="form-group">

                <label>Username</label>

                <input type="text" id="username">

            </div>


            <div class="form-group">

                <label>Email</label>

                <input type="email" id="email">

            </div>


            <div class="form-group">

                <label>Password</label>

                <input type="password" id="password">

            </div>


            <div class="form-group">

                <label>Role</label>

                <select id="role">

                    <option>Admin</option>

                    <option>Petugas</option>

                </select>

            </div>


            <button class="simpan" onclick="simpan()">

                💾 Simpan

            </button>

            <button class="batal" onclick="tutup()">

                ❌ Batal

            </button>

        </div>

    </div>


    <script>

        let users =
            JSON.parse(
                localStorage.getItem("dataUser")
            ) || [

                {
                    nama: "Administrator",
                    username: "admin",
                    email: "admin@gmail.com",
                    password: "admin123",
                    role: "Admin"
                }

            ];


        let edit = -1;


        function tampilkan() {

            const tabel =
                document.getElementById("tabel");

            tabel.innerHTML = "";


            users.forEach(function (user, index) {

                tabel.innerHTML += `

<tr>

<td>${index + 1}</td>

<td>👤 ${user.nama}</td>

<td>${user.username}</td>

<td>${user.email}</td>

<td>${user.role}</td>

<td>

<button
class="edit"
onclick="editData(${index})">

✏️ Edit

</button>

<button
class="hapus"
onclick="hapus(${index})">

🗑️ Hapus

</button>

</td>

</tr>

`;

            });

        }


        function bukaModal() {

            edit = -1;

            document.getElementById("judul")
                .innerText = "Tambah User";

            document.getElementById("nama").value = "";
            document.getElementById("username").value = "";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
            document.getElementById("role").value = "Admin";

            document.getElementById("modal")
                .style.display = "flex";

        }


        function tutup() {

            document.getElementById("modal")
                .style.display = "none";

        }


        function simpan() {

            const nama =
                document.getElementById("nama").value.trim();

            const username =
                document.getElementById("username").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const role =
                document.getElementById("role").value;


            if (!nama || !username || !email) {

                alert("Lengkapi data terlebih dahulu!");

                return;

            }


            const user = {

                nama: nama,

                username: username,

                email: email,

                password: password,

                role: role

            };


            if (edit === -1) {

                users.push(user);

            } else {

                users[edit] = user;

            }


            localStorage.setItem(
                "dataUser",
                JSON.stringify(users)
            );

            tampilkan();

            tutup();

        }


        function editData(index) {

            edit = index;

            const user = users[index];

            document.getElementById("judul")
                .innerText = "Edit User";

            document.getElementById("nama").value = user.nama;
            document.getElementById("username").value = user.username;
            document.getElementById("email").value = user.email;
            document.getElementById("password").value = user.password;
            document.getElementById("role").value = user.role;

            document.getElementById("modal")
                .style.display = "flex";

        }


        function hapus(index) {

            if (users.length === 1) {

                alert("Minimal harus ada satu user!");

                return;

            }


            if (confirm("Hapus user ini?")) {

                users.splice(index, 1);

                localStorage.setItem(
                    "dataUser",
                    JSON.stringify(users)
                );

                tampilkan();

            }

        }


        tampilkan();

    </script>

</body>

</html>
