<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Segoe UI;
        }

        .navbar {
            background: #081225;
        }

        .sidebar-card {
            border: none;
            border-radius: 15px;
            color: white;
        }

        .card1 {
            background: #2563eb;
        }

        .card2 {
            background: #16a34a;
        }

        .card3 {
            background: #f59e0b;
        }

        .card4 {
            background: #dc2626;
        }

        .menu-card {
            border: none;
            border-radius: 15px;
            transition: .3s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>
    <script>

        if (localStorage.getItem("adminLogin") != "true") {

            alert("Silakan Login Terlebih Dahulu!");

            window.location.href = "loginuser.html";

        }

        function logoutAdmin() {

            localStorage.removeItem("adminLogin");

            window.location.href = "../index.html";

        }

    </script>

    <nav class="navbar navbar-dark">
        <div class="container">

            <a class="navbar-brand fw-bold">
                📚 Dashboard Admin
            </a>

            <a href="../index.html" class="btn btn-light">
                🏠 Home
            </a>

        </div>
    </nav>

    <div class="container mt-4">

        <div class="alert alert-primary">

            <h3>
                👋 Selamat Datang Admin razaq
            </h3>

            Kelola seluruh data penjualan buku dari dashboard ini.

        </div>

        <div class="row">

            <div class="col-md-3 mb-3">

                <div class="card sidebar-card card1">

                    <div class="card-body">

                        <h5>📚 Total Buku</h5>

                        <h2>150</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-3">

                <div class="card sidebar-card card2">

                    <div class="card-body">

                        <h5>👥 Pelanggan</h5>

                        <h2>75</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-3">

                <div class="card sidebar-card card3">

                    <div class="card-body">

                        <h5>💰 Penjualan</h5>

                        <h2>Rp15JT</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-3 mb-3">

                <div class="card sidebar-card card4">

                    <div class="card-body">

                        <h5>📦 Pesanan</h5>

                        <h2>12</h2>

                    </div>

                </div>

            </div>

        </div>

        <h3 class="mt-4 mb-3">
            ⚡ Menu Admin
        </h3>

        <div class="row">

            <div class="col-md-4 mb-3">

                <a href="kelolaproduk.html" style="text-decoration:none">

                    <div class="card menu-card shadow">

                        <div class="card-body text-center">

                            <h1>📖</h1>

                            <h4>Kelola Produk</h4>

                        </div>

                    </div>

                </a>

            </div>

            <div class="col-md-4 mb-3">

                <a href="kelolapelanggan.html" style="text-decoration:none">

                    <div class="card menu-card shadow">

                        <div class="card-body text-center">

                            <h1>👥</h1>

                            <h4>Kelola Pelanggan</h4>

                        </div>

                    </div>

                </a>

            </div>

            <div class="col-md-4 mb-3">

                <a href="laporan.html" style="text-decoration:none">

                    <div class="card menu-card shadow">

                        <div class="card-body text-center">

                            <h1>📊</h1>

                            <h4>Laporan</h4>

                        </div>

                    </div>

                </a>

            </div>
            <button class="btn btn-danger" onclick="logoutAdmin()">

                🚪 Logout

            </button>

        </div>

    </div>
    <script>

        function logoutAdmin() {

            localStorage.removeItem(
                "adminLogin"
            );

            window.location.href =
                "../index.html";

        }

    </script>

</body>

</html>
